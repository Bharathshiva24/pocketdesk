<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fafafa">
<title>PocketDesk — TV</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/tv.css">
<style>html,body{margin:0;height:100%;background:#f4f4f5;overflow:hidden}#tv{position:fixed;inset:0}</style>
</head>
<body>
<div id="tv"></div>
<script src="vendor/peerjs.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="js/icons.js"></script>
<script src="js/transport.js"></script>
<script src="js/tv.js"></script>
<script>
  (async () => {
    const transport = await PocketDeskTransport.createTransport('tv');
    window.desk = new PocketDeskTV.TVDesktop(document.getElementById('tv'), transport);
  })();
  // Go full screen on the first remote/keyboard press (TV browsers allow it on user input).
  const fs = () => document.documentElement.requestFullscreen?.().catch(() => {});
  addEventListener('keydown', fs, { once: true });
  addEventListener('click', fs, { once: true });
</script>
</body>
</html>
