<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PocketDesk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PocketDesk — Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/phone.css">
<style>html,body{margin:0;height:100%;background:#fafafa;overscroll-behavior:none}#phone{position:fixed;inset:0}</style>
</head>
<body>
<div id="phone"></div>
<script src="vendor/peerjs.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/transport.js"></script>
<script src="js/phone.js"></script>
<script>
  (async () => {
    const transport = await PocketDeskTransport.createTransport('phone');
    window.remote = new PocketDeskPhone.PhoneRemote(document.getElementById('phone'), transport);
  })();
</script>
</body>
</html>
